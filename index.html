<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekklesia · protótipo do MVP</title>
<style>
  :root{--ink:#1C2B2E;--ink2:#5E6B6D;--line:#E3E1DC;--paper:#F5F3EF;--petrol:#0F4C5C;--petrol50:#EEF5F6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#E9E6E0;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
  header{position:fixed;top:0;left:0;right:0;height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 16px;z-index:10}
  header b{font-size:15px;letter-spacing:-.01em}
  header .sub{font-size:13px;color:var(--ink2)}
  header .sp{flex:1}
  header button,header select{font:inherit;font-size:13px;height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);cursor:pointer}
  header button:hover{border-color:#B9B5AD}
  #menu{position:fixed;top:48px;left:0;bottom:0;width:280px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px 0 24px;z-index:9;transform:translateX(-100%);transition:transform .2s}
  #menu.open{transform:none}
  #menu.open ~ #stage{left:280px}
  #menu h4{margin:16px 16px 4px;font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
  #menu a{display:block;padding:7px 16px;font-size:13px;color:var(--ink);text-decoration:none;border-left:2px solid transparent}
  #menu a:hover{background:var(--paper)}
  #menu a.on{border-left-color:var(--petrol);background:var(--petrol50);color:var(--petrol);font-weight:600}
  #stage{position:fixed;top:48px;left:0;right:0;bottom:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:24px}
  #frameWrap{position:relative;background:#fff;box-shadow:0 1px 0 var(--line),0 8px 24px rgba(0,0,0,.06);transform-origin:top center}
  #frameWrap.phone{border-radius:36px;padding:12px;background:#1C2B2E;box-shadow:0 12px 32px rgba(0,0,0,.18)}
  #frameWrap.phone iframe{border-radius:26px}
  iframe{display:block;border:0;background:#fff}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;font-size:13px;padding:10px 14px;border-radius:8px;transition:.2s;pointer-events:none;z-index:20}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #hint{font-size:12px;color:var(--ink2)}
  @media (max-width:700px){#hint,header .sub{display:none}}
</style>
</head>
<body>
<header>
  <button id="btnMenu" aria-label="Todas as telas">☰ Telas</button>
  <b>Ekklesia</b><span class="sub">Protótipo do MVP · dados fictícios</span>
  <span class="sp"></span>
  <span id="hint">Clique no menu lateral, nos botões e nas linhas para navegar</span>
  <button id="btnPrev" aria-label="Tela anterior">←</button>
  <button id="btnNext" aria-label="Próxima tela">→</button>
</header>
<nav id="menu"></nav>
<main id="stage"><div id="frameWrap"><iframe id="f" title="Tela do protótipo"></iframe></div></main>
<div id="toast"></div>
<script>
const SCREENS = [{"slug": "inicio", "label": "Início", "group": "Desktop", "kind": "d", "w": 1440, "h": 900}, {"slug": "inicio-selecao", "label": "Início · 1 selecionada", "group": "Desktop", "kind": "d", "w": 1440, "h": 900}, {"slug": "visitantes", "label": "Visitantes", "group": "Desktop", "kind": "d", "w": 1440, "h": 1300}, {"slug": "registrar-contato", "label": "Registrar contato", "group": "Desktop", "kind": "d", "w": 1440, "h": 900}, {"slug": "novo-visitante", "label": "Novo visitante", "group": "Desktop", "kind": "d", "w": 1440, "h": 948}, {"slug": "novo-visitante-duplicado", "label": "Novo visitante · telefone já cadastrado", "group": "Desktop", "kind": "d", "w": 1440, "h": 948}, {"slug": "pessoas", "label": "Pessoas", "group": "Desktop", "kind": "d", "w": 1440, "h": 1216}, {"slug": "consentimento-massa", "label": "Pedir consentimento em massa", "group": "Desktop", "kind": "d", "w": 1440, "h": 908}, {"slug": "frequencia", "label": "Frequência", "group": "Desktop", "kind": "d", "w": 1440, "h": 976}, {"slug": "ministerios", "label": "Ministérios", "group": "Desktop", "kind": "d", "w": 1440, "h": 900}, {"slug": "agenda", "label": "Agenda", "group": "Desktop", "kind": "d", "w": 1440, "h": 900}, {"slug": "permissoes", "label": "Permissões e auditoria", "group": "Desktop", "kind": "d", "w": 1440, "h": 940}, {"slug": "assistente", "label": "Assistente (⌘K)", "group": "Desktop", "kind": "d", "w": 1440, "h": 900}, {"slug": "ficha", "label": "Ficha de visitante (QR code)", "group": "Celular", "kind": "m", "w": 390, "h": 1240}, {"slug": "ficha-enviada", "label": "Ficha enviada", "group": "Celular", "kind": "m", "w": 390, "h": 844}, {"slug": "termo", "label": "Termo de consentimento", "group": "Celular", "kind": "m", "w": 390, "h": 1240}, {"slug": "lider", "label": "Início do líder", "group": "Celular", "kind": "m", "w": 390, "h": 844}, {"slug": "contato-celular", "label": "Registrar contato · tentativas", "group": "Celular", "kind": "m", "w": 390, "h": 960}, {"slug": "contato-celular-1a", "label": "Registrar contato · 1ª visita", "group": "Celular", "kind": "m", "w": 390, "h": 960}, {"slug": "contagem", "label": "Frequência · contagem rápida", "group": "Celular", "kind": "m", "w": 390, "h": 844}, {"slug": "chamada", "label": "Frequência · chamada nominal", "group": "Celular", "kind": "m", "w": 390, "h": 844}, {"slug": "escala", "label": "Escala · confirmar por link", "group": "Celular", "kind": "m", "w": 390, "h": 844}, {"slug": "escala-recusada", "label": "Escala · recusada", "group": "Celular", "kind": "m", "w": 390, "h": 844}, {"slug": "config-1", "label": "Configuração 1/4 · Igreja", "group": "Configuração inicial", "kind": "d", "w": 1440, "h": 900}, {"slug": "config-2", "label": "Configuração 2/4 · Cultos", "group": "Configuração inicial", "kind": "d", "w": 1440, "h": 900}, {"slug": "config-3", "label": "Configuração 3/4 · Ministérios", "group": "Configuração inicial", "kind": "d", "w": 1440, "h": 900}, {"slug": "config-4", "label": "Configuração 4/4 · Importar", "group": "Configuração inicial", "kind": "d", "w": 1440, "h": 900}, {"slug": "pessoas-vazio", "label": "Pessoas · primeiro uso", "group": "Estados", "kind": "d", "w": 1440, "h": 900}, {"slug": "pessoas-sem-resultado", "label": "Pessoas · filtro sem resultado", "group": "Estados", "kind": "d", "w": 1440, "h": 900}, {"slug": "pessoas-carregando", "label": "Pessoas · carregando", "group": "Estados", "kind": "d", "w": 1440, "h": 900}, {"slug": "pessoas-erro", "label": "Pessoas · erro", "group": "Estados", "kind": "d", "w": 1440, "h": 900}, {"slug": "inicio-escuro", "label": "Início · modo escuro", "group": "Estados", "kind": "d", "w": 1440, "h": 900}, {"slug": "design-system", "label": "Sistema de design", "group": "Sistema de design", "kind": "d", "w": 1440, "h": 2800}];
const bySlug = Object.fromEntries(SCREENS.map(s=>[s.slug,s]));
const norm = t => t.toLowerCase().replace(/\s+\d+$/,'').replace(/[·•]/g,' ').replace(/\s+/g,' ').trim();

// Navegação global: itens da sidebar e ações comuns
const GLOBAL = {
  'início':'inicio','visitantes':'visitantes','pessoas':'pessoas','frequência':'frequencia',
  'ministérios':'ministerios','agenda':'agenda','permissões':'permissoes',
  'novo visitante':'novo-visitante','__busca':'assistente','abrir agenda':'agenda',
  'ver todos os 24':'visitantes','ver tudo':'permissoes','nova pessoa':'novo-visitante',
};
// Navegação por tela (tem prioridade sobre a global)
const LOCAL = {
  'inicio':{'__row':'inicio-selecao','registrar contato':'registrar-contato'},
  'inicio-selecao':{'registrar contato':'registrar-contato','atribuir responsável':'visitantes','__row':'inicio'},
  'visitantes':{'registrar contato':'registrar-contato','__row':'visitantes'},
  'registrar-contato':{'cancelar':'visitantes','salvar contato':'visitantes','×':'visitantes','__esc':'visitantes','registrar como visita':'visitantes'},
  'novo-visitante':{'cancelar':'visitantes','salvar visitante':'visitantes','×':'visitantes','__esc':'visitantes','__dup':'novo-visitante-duplicado'},
  'novo-visitante-duplicado':{'cancelar':'visitantes','salvar visitante':'visitantes','ver perfil':'pessoas','×':'visitantes','__esc':'visitantes'},
  'pessoas':{'enviar pedido de consentimento':'consentimento-massa','limpar':'pessoas-sem-resultado','registrar contato':'registrar-contato','×':'pessoas','completar':'pessoas'},
  'consentimento-massa':{'enviar para 511 pessoas':'pessoas','×':'pessoas','limpar':'pessoas'},
  'assistente':{'__esc':'inicio','abrir em visitantes com este filtro':'visitantes','esc':'inicio'},
  'frequencia':{'registrar frequência':'contagem','__row':'contagem'},
  'ficha':{'enviar ficha':'ficha-enviada','ler o termo completo':'termo'},
  'ficha-enviada':{'__any':'ficha'},
  'termo':{'autorizo':'ficha-enviada','não autorizo':'ficha'},
  'lider':{'__row':'contato-celular','confirmar':'escala','não posso':'escala-recusada','frequência':'contagem','escalas':'escala','visitantes':'contato-celular'},
  'contato-celular':{'salvar contato':'lider','meus visitantes':'lider','trocar modelo':'contato-celular-1a'},
  'contato-celular-1a':{'salvar contato':'lider','meus visitantes':'lider','trocar modelo':'contato-celular'},
  'contagem':{'usar chamada nominal':'chamada','salvar contagem':'frequencia'},
  'chamada':{'usar contagem':'contagem','concluir chamada':'frequencia','novo visitante':'ficha'},
  'escala':{'não posso':'escala-recusada','confirmar':'lider'},
  'escala-recusada':{'mudei de ideia, posso ir':'escala','enviar recado':'lider'},
  'config-1':{'continuar':'config-2'},
  'config-2':{'continuar':'config-3','voltar':'config-1'},
  'config-3':{'continuar':'config-4','voltar':'config-2','pular por enquanto':'config-4'},
  'config-4':{'voltar':'config-3','importar 538 pessoas':'inicio','começar do zero, sem importar':'pessoas-vazio'},
  'pessoas-vazio':{'importar planilha':'config-4','cadastrar uma pessoa':'novo-visitante'},
  'pessoas-sem-resultado':{'limpar filtros':'pessoas'},
  'pessoas-erro':{'tentar de novo':'pessoas'},
};
// Telas de celular não têm sidebar: não aplicar a navegação global nelas
const MOBILE_NO_GLOBAL = new Set(SCREENS.filter(s=>s.kind==='m').map(s=>s.slug));

let cur = null;
const f = document.getElementById('f'), wrap = document.getElementById('frameWrap'), menu = document.getElementById('menu');

// Menu de telas
let g=null;
SCREENS.forEach(s=>{ if(s.group!==g){g=s.group;const h=document.createElement('h4');h.textContent=g;menu.appendChild(h);}
  const a=document.createElement('a');a.href='#'+s.slug;a.textContent=s.label;a.dataset.slug=s.slug;
  a.onclick=e=>{e.preventDefault();go(s.slug);if(innerWidth<1100)menu.classList.remove('open');};menu.appendChild(a);});
document.getElementById('btnMenu').onclick=()=>{menu.classList.toggle('open');setTimeout(fit,210);};
const order=SCREENS.map(s=>s.slug);
document.getElementById('btnPrev').onclick=()=>go(order[(order.indexOf(cur)-1+order.length)%order.length]);
document.getElementById('btnNext').onclick=()=>go(order[(order.indexOf(cur)+1)%order.length]);

function fit(){ const s=bySlug[cur]; if(!s) return;
  const phone=s.kind==='m'; wrap.classList.toggle('phone',phone);
  const vw=document.getElementById('stage').clientWidth-48;
  const w=s.w, h=phone?Math.min(s.h,844):s.h;
  f.style.width=w+'px'; f.style.height=h+'px';
  const scale=phone?Math.min(1,(innerHeight-48-48)/(h+24)):Math.min(1,vw/w);
  wrap.style.transform='scale('+scale+')';
  wrap.style.marginBottom=((h+(phone?24:0))*(scale-1))+'px';
}
function go(slug,push=true){ if(!bySlug[slug]) return; cur=slug; f.src='telas/'+slug+'.html';
  [...menu.querySelectorAll('a')].forEach(a=>a.classList.toggle('on',a.dataset.slug===slug));
  if(push) history.replaceState(null,'','#'+slug); document.title='Ekklesia · '+bySlug[slug].label; fit();
  document.getElementById('stage').scrollTop=0;}
addEventListener('resize',fit);
addEventListener('hashchange',()=>go(location.hash.slice(1)||'inicio',false));

let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}

addEventListener('message',e=>{ const d=e.data; if(!d||!d.ek) return;
  const loc=LOCAL[cur]||{}; const cands=d.c.map(norm);
  // telefone duplicado: clicar no campo telefone do Novo visitante mostra o estado
  if(cur==='novo-visitante' && cands.some(c=>/telefone com whatsapp|\(81\)/.test(c))) return go('novo-visitante-duplicado');
  for(const c of cands){ if(loc[c]) return go(loc[c]); }
  if(!MOBILE_NO_GLOBAL.has(cur)||cur==='lider'){ for(const c of cands){ if(GLOBAL[c]) return go(GLOBAL[c]); } }
  if(d.row && loc['__row']) return go(loc['__row']);
  if(loc['__any']) return go(loc['__any']);
  if(d.c[0] && d.c[0]!=='__esc' && /^(A|BUTTON)$/.test(d.tag||'')) toast('Esta interação ainda não está no protótipo');
});
go(location.hash.slice(1)||'inicio',false);
if(innerWidth>=1400){menu.classList.add('open');setTimeout(fit,50);}
</script>
</body>
</html>
